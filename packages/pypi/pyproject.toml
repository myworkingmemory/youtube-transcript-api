[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wicked-youtube-transcript"
version = "1.0.0"
description = "YouTube transcript API client: timestamped transcripts, SRT, WebVTT, caption languages and video facts for any public video, via RapidAPI. No YouTube API key."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Myworkingmemory LLC", email = "support@myworkingmemory.ai" }]
requires-python = ">=3.8"
keywords = ["youtube", "transcript", "captions", "subtitles", "srt", "vtt", "youtube-transcript", "llm", "rag", "rapidapi"]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Multimedia :: Video", "Topic :: Text Processing"]
dependencies = []

[project.urls]
Homepage = "https://rapidapi.com/Myworkingmemory/api/wicked-youtube-transcript-scraper"
Source = "https://github.com/myworkingmemory/youtube-transcript-api"

[tool.setuptools.packages.find]
include = ["wicked_youtube_transcript*"]
