<!doctype html><html><head><meta charset="utf-8"><style>
body{width:420px;font:14px/1.4 -apple-system,Segoe UI,Arial,sans-serif;margin:0;padding:12px;color:#111}
h1{font-size:15px;margin:0 0 8px}.row{display:flex;gap:6px;align-items:center;margin:6px 0}
button{font:inherit;padding:6px 10px;border:1px solid #888;border-radius:6px;background:#f6f6f6;cursor:pointer}button.primary{background:#e62117;color:#fff;border-color:#e62117}
select,input{font:inherit;padding:4px 6px}#out{white-space:pre-wrap;max-height:300px;overflow:auto;border:1px solid #ddd;border-radius:6px;padding:8px;margin-top:8px;font-size:13px;background:#fafafa}
#status{color:#555;font-size:13px}a{color:#0b57d0}label{font-size:13px}
</style></head><body>
<h1>YouTube Transcript</h1>
<div class="row"><label>Language <select id="lang"><option value="en">English</option><option value="es">Spanish</option><option value="fr">French</option><option value="de">German</option><option value="pt">Portuguese</option><option value="it">Italian</option><option value="ja">Japanese</option><option value="ko">Korean</option><option value="hi">Hindi</option><option value="ar">Arabic</option><option value="ru">Russian</option><option value="zh">Chinese</option></select></label>
<label><input type="checkbox" id="stamps"> timestamps</label>
<button class="primary" id="go">Get transcript</button></div>
<div id="status"></div>
<div class="row" id="actions" hidden><button id="copy">Copy</button><button id="txt">Download .txt</button><button id="srt">Download .srt</button></div>
<div id="out" hidden></div>
<p id="nokey" hidden>Add your free RapidAPI key in <a href="#" id="opts">settings</a> (50 transcripts a month free, then from $4.99 for 4,000).</p>
<script type="module" src="popup.js"></script></body></html>
